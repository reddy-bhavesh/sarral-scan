version: '3.8'

services:
  # Database - MySQL 8 (CTEM M8 cutover from SQLite)
  db:
    image: mysql:8.0
    container_name: scout-db
    environment:
      MYSQL_DATABASE: scout
      MYSQL_USER: scout
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scout}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"   # exposed for local dev / prisma db push from the host
    volumes:
      - scout-db:/var/lib/mysql
    networks:
      - scout-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uscout", "-p${MYSQL_PASSWORD:-scout}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Frontend - React SPA served by Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scout-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - scout-network
    restart: unless-stopped

  # Backend - FastAPI with Security Tools
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scout-backend
    ports:
      - "8000:8000"
    environment:
      # Database (MySQL). entrypoint.sh waits for it and runs `prisma db push`.
      - DATABASE_URL=mysql://scout:${MYSQL_PASSWORD:-scout}@db:3306/scout
      # Execution mode - "local" for container, "ssh" for remote Kali
      - EXECUTION_MODE=local
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-this}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # AI APIs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      # CVE enrichment (optional NVD key raises rate limit)
      - NVD_API_KEY=${NVD_API_KEY:-}
      # Microsoft SSO (optional)
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-organizations}
      - ENABLE_MICROSOFT_SSO=${ENABLE_MICROSOFT_SSO:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persistent storage for reports
      - scout-reports:/app/reports
    networks:
      - scout-network
    restart: unless-stopped
    # Allow running security tools
    cap_add:
      - NET_RAW
      - NET_ADMIN

networks:
  scout-network:
    driver: bridge

volumes:
  scout-db:
    driver: local
  scout-reports:
    driver: local
